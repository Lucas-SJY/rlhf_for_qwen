# GPU Job that answers a task file with the run's latest export and the SFT checkpoint it
# started from, and scores every answer (src/answer_tasks.py). Results go to
# /grpo/answers/<RUN_NAME>/ on the RL PVC.
#
# Submitted by ../run.sh answer, which substitutes the ${...} placeholders, first puts the
# task file (ANSWER_TASKS, default manual_inspection/tasks.jsonl) into the ConfigMap
# ${JOB_NAME}-answer-tasks, and afterwards copies the results to ./answers/<RUN_NAME>/.
# One card of GPU_TYPE is plenty: inference of the 8B model in bf16 needs ~16 GB plus the
# KV cache. ANSWER_SAMPLES in .env sets the answers per question and model (default 4).
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}-answer
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: nrp-registry
      priorityClassName: ${GPU_PRIORITY_CLASS}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: ${GPU_PRODUCTS}
      containers:
        - name: answer
          image: ${IMAGE}
          imagePullPolicy: Always
          command: ["python3", "/workspace/src/answer_tasks.py"]
          envFrom:
            - secretRef:
                name: grpo-env
          resources:
            requests:
              ${GPU_RESOURCE}: 1
              cpu: "8"
              memory: 64Gi
              ephemeral-storage: 20Gi
            limits:
              ${GPU_RESOURCE}: 1
              cpu: "8"
              memory: 64Gi
              ephemeral-storage: 20Gi
          volumeMounts:
            - name: rl
              mountPath: /grpo
            - name: tasks
              mountPath: /tasks
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: rl
          persistentVolumeClaim:
            claimName: ${RL_PVC_NAME}
        - name: tasks
          configMap:
            name: ${JOB_NAME}-answer-tasks
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
