name: GRPO CPU checks
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: GRPO/requirements-test.txt
      - run: python -m pip install 'torch>=2.11,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r GRPO/requirements-test.txt
      - run: bash -n run.sh GRPO/src/entrypoint.sh
      - run: ./run.sh test
      - run: python GRPO/src/diagnose.py --require-torch
      - uses: actions/checkout@v4
        with:
          repository: rllm-org/rllm
          ref: 3b40c37cf6a262cf4d28cc987ebe4f4cf797956c
          path: .upstream/rllm
      - uses: actions/checkout@v4
        with:
          repository: verl-project/verl
          ref: v0.8.0
          path: .upstream/verl
      - run: python GRPO/tests/check_pinned_config.py --rllm-source .upstream/rllm --verl-source .upstream/verl
