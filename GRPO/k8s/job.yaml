# GRPO training Job: one pod, N_GPUS cards on one node (GPU_TYPE in .env: l40, a6000 or
# a100). Same pattern as ../../train/k8s/job.yaml.
#
# Do not apply this file by hand -- ../run.sh substitutes ${IMAGE}, ${JOB_NAME},
# ${SFT_PVC_NAME}, ${RL_PVC_NAME}, ${POD_CPU}, ${POD_MEMORY}, ${N_GPUS} and the GPU
# settings derived from GPU_TYPE, and creates the Secrets it depends on:
#   ./run.sh submit     just (re)submit
#   ./run.sh            data + image + secrets + pvc + submit + logs
#
# Hyperparameters and keys arrive through the grpo-env Secret (envFrom); this file only
# describes hardware and volumes.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
spec:
  backoffLimit: 2              # an evicted pod resumes from the last checkpoint
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: nrp-registry
      # The card comes from GPU_TYPE (see ../run.sh), which sets the resource key below,
      # the allowed card models and the priority class:
      #   l40   nvidia.com/gpu      L40 / L40S (48 GB)  no quota, normal priority
      #   a6000 nvidia.com/rtxa6000 RTX A6000 (48 GB)   no quota, normal priority
      #   a100  nvidia.com/a100     A100-80GB           quota 4; "opportunistic" unless
      #                                                 GPU_PRIORITY_CLASS is set (empty =
      #                                                 normal priority, not preemptible)
      # All run drivers >= 595 (CUDA 13.2) and support flash-attn 2 and bf16. An empty
      # priority class means the default.
      priorityClassName: ${GPU_PRIORITY_CLASS}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: ${GPU_PRODUCTS}
      containers:
        - name: trainer
          image: ${IMAGE}
          imagePullPolicy: Always
          command: ["bash", "/workspace/src/entrypoint.sh"]
          envFrom:
            - secretRef:
                name: grpo-env
          # CPU and RAM come from POD_CPU / POD_MEMORY in .env (default 8 / 160Gi, sized
          # for the 8B LoRA run on one GPU). Host memory holds whatever is not on the GPU
          # at the moment: the offloaded actor (LoRA: bf16 base ~16G plus the fp32 adapter
          # and its Adam state; full-parameter: fp32 weights ~33G and Adam state ~66G),
          # vLLM's sleeping weights (LoRA only, ~16G), the Ray object store (/dev/shm,
          # RAY_OBJECT_STORE_GB) and the Ray worker processes. There is no critic.
          # NRP policy: cpu limit/request ratio <= 1.2 and GPU requests == limits; keep all
          # equal.
          resources:
            requests:
              ${GPU_RESOURCE}: ${N_GPUS}
              cpu: "${POD_CPU}"
              memory: ${POD_MEMORY}
              ephemeral-storage: 30Gi
            limits:
              ${GPU_RESOURCE}: ${N_GPUS}
              cpu: "${POD_CPU}"
              memory: ${POD_MEMORY}
              ephemeral-storage: 30Gi
          volumeMounts:
            - name: sft
              mountPath: /data
              readOnly: true
            - name: rl
              mountPath: /grpo
            - name: dshm          # Ray's object store; must exceed RAY_OBJECT_STORE_GB
              mountPath: /dev/shm
      volumes:
        - name: sft
          persistentVolumeClaim:
            claimName: ${SFT_PVC_NAME}
            readOnly: true
        - name: rl
          persistentVolumeClaim:
            claimName: ${RL_PVC_NAME}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 24Gi
