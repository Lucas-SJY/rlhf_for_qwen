# Small GRPO example Job: Qwen3-0.6B, full-parameter, one 24-48GB Ampere/Ada GPU.
# Same pattern as ../../k8s/job.yaml and ../../../../train/k8s/job.yaml.
#
# Do not apply this file by hand -- ../run.sh substitutes ${IMAGE}, ${JOB_NAME} and
# ${RL_PVC_NAME}, and creates the Secrets it depends on:
#   ./run.sh submit     just (re)submit
#   ./run.sh            data + image + secrets + pvc + submit + logs
#
# Model, hyperparameters and keys (including WANDB_API_KEY) arrive through the
# grpo-example-env Secret (envFrom); this file only describes hardware and volumes.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: nrp-registry
      # Generic GPUs instead of A100: the namespace's A100 quota (ResourceQuota a100-limit)
      # is 0, while nvidia.com/gpu has no quota, so the pod runs at normal priority and is
      # never preempted. nvidia.com/gpu covers every generic GPU type on NRP; the affinity
      # below keeps the pod on Ampere/Ada cards (flash-attn 2, bf16) with at least 24GB, and
      # the scheduler takes whichever of them has a free card. All of their nodes run
      # drivers >= 595 (CUDA 13.2), so the CUDA 13 image needs no forward compatibility.
      # GPU memory: the smoke test fits every card in the list. The full example (8192-token
      # responses, 12288-token micro-batches) is sized for the 48GB cards; on a 24GB card the
      # log-prob and entropy pass over the 152k-token vocabulary may run out of memory. If it
      # does, lower MAX_RESPONSE_LENGTH or keep only NVIDIA-L40 and NVIDIA-L40S below.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40                      # 48GB
                      - NVIDIA-L40S                     # 48GB
                      - NVIDIA-RTX-5000-Ada-Generation  # 32GB
                      - NVIDIA-A10                      # 24GB
                      - NVIDIA-L4                       # 24GB
                      - NVIDIA-GeForce-RTX-4090         # 24GB
      containers:
        - name: trainer
          image: ${IMAGE}
          imagePullPolicy: Always
          command: ["bash", "/workspace/src/entrypoint.sh"]
          envFrom:
            - secretRef:
                name: grpo-example-env
          # Host memory: the offloaded actor and its Adam state (~10G for 0.6B), the
          # reference model, vLLM, the Ray object store (/dev/shm, 8G) and the Ray processes.
          # NRP policy: cpu limit/request ratio <= 1.2 and GPU requests == limits.
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: "8"
              memory: 64Gi
              ephemeral-storage: 20Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "8"
              memory: 64Gi
              ephemeral-storage: 20Gi
          volumeMounts:
            - name: rl
              mountPath: /grpo
            - name: dshm          # Ray's object store; must exceed RAY_OBJECT_STORE_GB
              mountPath: /dev/shm
      volumes:
        - name: rl
          persistentVolumeClaim:
            claimName: ${RL_PVC_NAME}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 12Gi
